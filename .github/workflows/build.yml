# 自动打包：在 GitHub 的 Windows 和 Mac 机器上把程序打包成双击就能用的版本。
#
# - 在网页上发布一个 Release（比如 v1.0.0）时自动运行，打好的
#   DeskPond-Windows.zip 和 DeskPond-macOS.zip 会自动挂到这个 Release 下面。
# - 也可以在 Actions 页面手动运行（Run workflow）：打好的包在这次运行的 Artifacts 里；
#   如果填了 tag（比如 v1.0.0），还会挂到这个已经存在的 Release 下面（Release 比本文件早发布时用来补包）。
#
# 打出来的包不含任何游戏素材：程序运行时从用户自己安装的《星露谷物语》里读取。
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补挂安装包的 Release 标签（比如 v1.0.0）；留空 = 只打包不上传"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-windows.txt pyinstaller==6.11.1
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --windowed --name DeskPond
          --collect-submodules src run_win.pyw
      - name: Smoke test (start the packaged exe with a fake game folder)
        # 用假的游戏素材真的跑一遍打好的 exe：能读素材、建托盘、进主循环，3 秒后自己退出。
        # 不通过就不发布，免得用户下到打不开的包。
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import test_qt_smoke as T; print(T.make_game(sys.argv[1])[0])" "$RUNNER_TEMP/fake" > game_dir.txt
          set +e
          DESKPOND_GAME_DIR="$(cat game_dir.txt)" timeout 600 dist/DeskPond/DeskPond.exe --selftest
          code=$?
          set -e
          echo "---- deskpond.log ----"; cat "$APPDATA/DeskPond/deskpond.log" || true
          echo "exit code: $code"
          grep -q "自检通过" "$APPDATA/DeskPond/deskpond.log"
          test "$code" = 0
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, NOTICE.md dist/DeskPond/
          Compress-Archive -Path dist/DeskPond -DestinationPath DeskPond-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPond-Windows
          path: DeskPond-Windows.zip
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" DeskPond-Windows.zip --clobber

  macos:
    runs-on: macos-latest          # Apple 芯片（M1 及以后）；Intel Mac 请用源码运行
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --windowed --name DeskPond
          --osx-bundle-identifier io.github.simonescoop.deskpond
          --collect-submodules src
          --hidden-import Quartz --hidden-import ApplicationServices
          run.py
      - name: Menu-bar app (no Dock icon) + re-sign
        # 改了 Info.plist 之后签名就失效了，Apple 芯片的 Mac 会说「已损坏」：必须重新签一次（ad-hoc 签名）
        run: |
          plutil -insert LSUIElement -bool true dist/DeskPond.app/Contents/Info.plist
          codesign --force --deep --sign - dist/DeskPond.app
          codesign --verify --deep --strict --verbose=2 dist/DeskPond.app
      - name: Zip
        run: |
          mkdir -p out/DeskPond
          cp -R dist/DeskPond.app out/DeskPond/
          cp README.md LICENSE NOTICE.md out/DeskPond/
          ditto -c -k --keepParent out/DeskPond DeskPond-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPond-macOS
          path: DeskPond-macOS.zip
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" DeskPond-macOS.zip --clobber
